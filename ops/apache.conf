<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    # Log Railway's X-Real-IP first so you can confirm the rate limiter sees real visitor IPs.
    LogFormat "real_ip=%{X-Real-IP}i peer=%h %t \"%r\" %>s %b" orbit
    CustomLog /proc/self/fd/1 orbit
</VirtualHost>
