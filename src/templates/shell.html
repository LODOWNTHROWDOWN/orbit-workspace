<div class="layout">
  <aside class="sidebar">
    <div class="brand"><svg class="icon brand-mark" aria-hidden="true"><use href="#i-orbit"/></svg> orbit<span class="brand-dot">.</span></div>
    <nav aria-label="Primary navigation">
      <button id="nav-dashboard" class="nav-link" type="button"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg> <span>Dashboard</span></button>
      <button id="nav-projects" class="nav-link" type="button"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg> <span>Projects</span></button>
    </nav>
    <div class="sidebar-foot"><span class="demo-dot"></span> Temporary demo workspace</div>
  </aside>
  <div class="content">
    <header class="topbar">
      <span class="mobile-brand"><svg class="icon" aria-hidden="true"><use href="#i-orbit"/></svg> orbit.</span>
      <span class="eyebrow">ORBIT / WORKSPACE</span>
      <div class="topbar-actions"><span class="demo-pill">DEMO MODE</span></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer">Built with vanilla JavaScript, PHP, SCSS and MySQL · Demo data expires after 24 hours</footer>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<dialog id="editor" aria-labelledby="dialog-title">
  <form id="editor-form">
    <div class="dialog-head"><h2 id="dialog-title">Create</h2><button class="icon-button" type="button" id="close-dialog" aria-label="Close dialog"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div id="fields"></div>
    <div class="dialog-actions"><button type="button" id="cancel-dialog" class="button secondary">Cancel</button><button class="button primary" type="submit">Save</button></div>
  </form>
</dialog>
